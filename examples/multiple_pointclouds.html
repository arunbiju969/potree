	<script type="module">

	import * as THREE from "../libs/three.js/build/three.module.js";
	
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.setMinNodeSize(10);
		viewer.loadSettingsFromURL();
		
		// viewer.setDescription removed to avoid showing page description
		
		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_scene").next().show();
			$("#menu_tools").next().show();
			// Force sidebar to be visible and keep it that way
			viewer.toggleSidebar();
		});


		// Default bulk-loading removed. Use the Open button or drag/drop to add pointclouds.

		// Disabled automatic loading of default pointclouds. Use the Open button to load clouds.
		// load();

		// Copy specific navigation view buttons (left/right/front/back/top/bottom)
		// into the top toolbar so they are immediately accessible.
		function addViewButtonsToTopToolbar(){
			const names = ['left.svg','right.svg','front.svg','back.svg','top.svg','bottom.svg'];
			const nav = document.getElementById('navigation');
			const toolbar = document.getElementById('top_toolbar_inner');
			if(!nav || !toolbar) return false;
			for(const img of Array.from(nav.querySelectorAll('img'))){
				const src = img.getAttribute('src') || '';
				const match = names.find(n => src.endsWith(n));
				if(!match) continue;
				// avoid adding duplicates
				if(toolbar.querySelector(`img[data-nav-copy='${match}']`)) continue;
				const clone = img.cloneNode(true);
				clone.setAttribute('data-nav-copy', match);
				clone.classList.add('cursor-pointer');
				// wire click on clone to trigger the original button's click
				clone.addEventListener('click', function(e){
					e.preventDefault();
					const original = nav.querySelector(`img[src$='${match}']`);
					if(original) original.click();
				});
				toolbar.appendChild(clone);
			}
			return true;
		}

		// Try to add buttons immediately; if navigation isn't populated yet, poll briefly.
		(function tryAddButtons(retries = 10){
			if(addViewButtonsToTopToolbar()) return;
			if(retries <= 0) return;
			setTimeout(() => tryAddButtons(retries - 1), 300);
		})();

		// Helper: assign a name to a point cloud and print debug info
		function assignPointCloudName(pc, u) {
			console.log('--- PointCloud Name Derivation ---');
			console.log('Input URL:', u);
			let name = u;
			try {
				const p = new URL(u);
				console.log('Parsed URL:', p);
				let path = p.pathname;
				console.log('Pathname:', path);
				// Remove leading slash for Windows drive letters
				path = path.replace(/^\/(?=[A-Za-z]:)/, '');
				const parts = path.split('/');
				console.log('Path parts:', parts);
				name = parts[parts.length-2] || parts[parts.length-1] || name;
				console.log('Derived name from path parts:', name);
			} catch(err) {
				console.log('URL parse failed, fallback to string split:', err);
				const parts = u.replace(/\\/g, '/').split('/');
				console.log('Fallback parts:', parts);
				name = parts[parts.length-2] || parts[parts.length-1] || name;
				console.log('Derived name from fallback parts:', name);
			}
			if (!name) {
				name = 'PointCloud';
				console.log('Name was empty, using default:', name);
			}
			pc.name = name;
			console.log('Final assigned name:', pc.name);
			console.log('-------------------------------');
		}

		// Electron: open pointcloud via native dialog (preload exposes electronAPI.openPointcloud)
		const openBtn = document.getElementById('openPointcloudBtn');
		if(openBtn){
			openBtn.addEventListener('click', async () => {
				if(!window.electronAPI) return alert('Electron API unavailable');
				const selected = await window.electronAPI.openPointcloud();
				if(!selected) return;

				let url = selected;
				if(!/^https?:\/\//.test(url) && !url.startsWith('file://')){
					url = url.replace(/\\/g, '/');
					url = 'file://' + url;
				}

				// If the user picked a LAS/LAZ/COPC file, trigger conversion via main process
				if(/\.(las|laz|copc)(\?|$)/i.test(url)){
					console.log('LAS/LAZ/COPC picked — requesting conversion:', url);

					// subscribe to progress (keeps existing behavior)
					window.electronAPI.onConvertProgress((data) => {
						console.log('[convert-progress]', data.type, data.text);
					});

					// helper: attempt to load a potree entry (direct URL, metadata.json, cloud.js)
					async function tryLoadPotree(resultUrl){
						const candidates = [resultUrl];

						// if resultUrl is a file:// directory (no extension), add metadata.json/cloud.js
						try{
							const parsed = new URL(resultUrl);
							if(parsed.protocol === 'file:'){
								const pathname = parsed.pathname;
								const last = pathname.split('/').pop();
								if(!/\.[a-z0-9]+$/i.test(last)){
									candidates.push(resultUrl.replace(/\/?$/, '/metadata.json'));
									candidates.push(resultUrl.replace(/\/?$/, '/cloud.js'));
								}
							}
						}catch(e){
							// ignore
						}

						for(const u of candidates){
							try{
								const e = await Potree.loadPointCloud(u);
								const pc = e.pointcloud;
								assignPointCloudName(pc, u);

								// rgba detection and material setup
								const hasRGBA = pc.getAttributes().attributes.find(a => a.name === 'rgba') !== undefined;
								if(hasRGBA){
									pc.material.activeAttributeName = 'rgba';
								}else{
									pc.material.activeAttributeName = 'color';
								}

								pc.material.size = 1;
								pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;

								viewer.scene.addPointCloud(pc);
								viewer.zoomTo(pc);

								return pc;
							}catch(loadErr){
								console.warn('load attempt failed for', u, loadErr);
								// try next candidate
							}
						}

						throw new Error('Failed to load converted pointcloud from any candidate URL');
					}

					try{
						const result = await window.electronAPI.convertPointcloud({ inputs: [url], version: '2.0' });
						console.log('conversion finished, result:', result);

						try{
							await tryLoadPotree(result);
							console.log('Converted pointcloud loaded');
						}catch(loadErr){
							console.error('Failed to auto-load converted result:', loadErr);
							alert('Conversion finished but auto-load failed. You can open the converted folder manually.');
						}
					}catch(err){
						console.error('conversion failed', err);
						alert('Conversion failed: ' + String(err));
					}

					return;
				}

				// otherwise attempt to load directly (cloud.js, ept.json, file:// or http(s))
				try{
					const e = await Potree.loadPointCloud(url);
					const pc = e.pointcloud;
					assignPointCloudName(pc, url);
					viewer.scene.addPointCloud(pc);
				}catch(err){
					console.error('failed to load pointcloud', err);
					alert('Failed to load pointcloud');
				}
			});
		}
	</script>

	<!-- Drag-to-resize script for height profile -->
	<script>
	(function(){
		const profile = document.getElementById('height_profile_container');
		const titlebar = document.getElementById('height_profile_titlebar');
		const renderArea = document.getElementById('potree_render_area');
		const closeBtn = document.getElementById('height_profile_close');
		if(!profile || !titlebar || !renderArea) return;

		let dragging = false;
		let startY = 0;
		let startHeight = 0;

		const MIN_PX = 80; // minimum profile height in px
		const MAX_PX = Math.max(120, window.innerHeight - 120);

		function onStart(e){
			e.preventDefault();
			dragging = true;
			startY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
			startHeight = profile.getBoundingClientRect().height;
			document.addEventListener('mousemove', onMove);
			document.addEventListener('mouseup', onEnd);
			document.addEventListener('touchmove', onMove, {passive:false});
			document.addEventListener('touchend', onEnd);
		}

		function onMove(e){
			if(!dragging) return;
			e.preventDefault();
			const y = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
			const delta = startY - y; // up increases height
			let newHeight = startHeight + delta;
			newHeight = Math.max(MIN_PX, Math.min(newHeight, MAX_PX));
			profile.style.height = newHeight + 'px';
			// update render area bottom so borders align
			renderArea.style.bottom = newHeight + 'px';
		}

		function onEnd(){
			dragging = false;
			document.removeEventListener('mousemove', onMove);
			document.removeEventListener('mouseup', onEnd);
			document.removeEventListener('touchmove', onMove);
			document.removeEventListener('touchend', onEnd);
		}

		titlebar.addEventListener('mousedown', onStart);
		titlebar.addEventListener('touchstart', onStart, {passive:false});

		if(closeBtn){
			closeBtn.addEventListener('click', function(){
				profile.style.display = 'none';
				renderArea.style.bottom = '0px';
			});
		}
	})();
	</script>
