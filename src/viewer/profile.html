<div
  id="profile_window"
  style="position: relative; display: none; height: 100%"
>
  <!-- toolbar: holds info and future controls -->
  <div
    class="profile-toolbar"
    style="
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      box-sizing: border-box;
      border-bottom: 2px solid #ff00b3;
    "
  >
    <div class="profile-info" aria-live="polite">
      <label for="profile_num_points" style="margin-right: 6px"
        >Number of Points:</label
      >
      <output id="profile_num_points">-</output>
    </div>

    <!-- controls aligned to the right; increased width and horizontal scroll if needed -->
    <div
      class="profile-controls"
      style="
        margin-left: auto;
        display: flex;
        gap: 10px;
        align-items: center;
        max-width: 70%;
        overflow-x: auto;
        overflow-y: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        padding-bottom: 2px;
      "
    >
      <input
        id="potree_profile_rotate_amount"
        type="text"
        maxlength="4"
        value="10"
        style="
          width: 2.2em;
          height: 2.2em;
          padding: 2px;
          font-size: 0.95rem;
          text-align: center;
          margin: 2px;
          box-sizing: border-box;
          flex: 0 0 auto;
        "
      />
      <!-- larger icons and input, kept inline and non-wrapping -->
      <img
        id="potree_profile_rotate_cw"
        class="text-icon"
        alt="rotate cw"
        style="
          width: 22px;
          height: 22px;
          margin: 2px;
          flex: 0 0 auto;
          cursor: pointer;
        "
      />
      <img
        id="potree_profile_rotate_ccw"
        class="text-icon"
        alt="rotate ccw"
        style="
          width: 22px;
          height: 22px;
          margin: 2px;
          flex: 0 0 auto;
          cursor: pointer;
        "
      />
      <img
        id="potree_profile_move_forward"
        class="text-icon"
        alt="move forward"
        style="
          width: 22px;
          height: 22px;
          margin: 2px;
          flex: 0 0 auto;
          cursor: pointer;
        "
      />
      <img
        id="potree_profile_move_backward"
        class="text-icon"
        alt="move backward"
        style="
          width: 22px;
          height: 22px;
          margin: 2px;
          flex: 0 0 auto;
          cursor: pointer;
        "
      />

      <!-- download links moved into toolbar (slightly bigger) -->
      <a
        id="potree_download_profile_dxf2D_link"
        href="#"
        download="profile_2D.dxf"
        title="Download 2D DXF"
        style="flex: 0 0 auto; display: inline-block"
      >
        <img
          id="potree_download_dxf2D_icon"
          class="text-icon"
          alt="dxf2d"
          style="width: 60px; height: 20px; margin: 2px; display: inline-block"
        />
      </a>

      <a
        id="potree_download_profile_dxf3D_link"
        href="#"
        download="profile_3D.dxf"
        title="Download 3D DXF"
        style="flex: 0 0 auto; display: inline-block"
      >
        <img
          id="potree_download_dxf3D_icon"
          class="text-icon"
          alt="dxf3d"
          style="width: 60px; height: 20px; margin: 2px; display: inline-block"
        />
      </a>

      <a
        id="potree_download_profile_ortho_link"
        href="#"
        download="profile.csv"
        title="Download CSV"
        style="flex: 0 0 auto; display: inline-block"
      >
        <img
          id="potree_download_csv_icon"
          class="text-icon"
          alt="csv"
          style="width: 60px; height: 20px; margin: 2px; display: inline-block"
        />
      </a>

      <a
        id="potree_download_profile_link"
        href="#"
        download="profile.las"
        title="Download LAS"
        style="flex: 0 0 auto; display: inline-block"
      >
        <img
          id="potree_download_las_icon"
          class="text-icon"
          alt="las"
          style="width: 60px; height: 20px; margin: 2px; display: inline-block"
        />
      </a>
    </div>
  </div>
  <div
    class="pw_content"
    style="
      position: absolute;
      top: 38px;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      box-sizing: border-box;
      border: 2px solid orange;
      padding: 6px;
    "
  >
    <div
      style="
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        box-sizing: border-box;
      "
    ></div>
    <div
      id="profileCanvasContainer"
      style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        /*background-color: #000000;*/
        border: 2px solid #00ff00;
        box-sizing: border-box;
      "
    >
      <!-- SVG overlay that fills the profileCanvasContainer -->
      <svg
        id="profileSVG"
        style="
          fill: #9d9d9d;
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          box-sizing: border-box;
          pointer-events: none;
          z-index: 2;
        "
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="none"
      ></svg>
    </div>
  </div>
</div>
